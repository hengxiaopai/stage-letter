name: Gate 0C Health Smoke

on:
  push:
    paths:
      - "experiments/gate0c/**"
      - ".github/workflows/gate0c-health-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Syntax check
        run: |
          python -m py_compile \
            experiments/gate0c/platform_health.py \
            experiments/gate0c/test_platform_health.py \
            experiments/gate0c/poll_policy.py \
            experiments/gate0c/test_poll_policy.py

      - name: Gate 0C acceptance tests
        run: python -m unittest discover -s experiments/gate0c -p "test_*.py" -v
