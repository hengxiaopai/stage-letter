name: Gate 0B Persistence Smoke

on:
  push:
    paths:
      - "experiments/gate0b/**"
      - ".github/workflows/gate0b-persistence-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Syntax check
        run: |
          python -m py_compile experiments/gate0b/state_engine.py
          python -m py_compile experiments/gate0b/sqlite_store.py

      - name: Gate 0B persistence tests
        run: python -m unittest discover -s experiments/gate0b -p "test_*.py" -v
